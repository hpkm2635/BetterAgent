version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: betteragent-nats
    command: ["-js"] # Enable JetStream
    ports:
      - "4222:4222"
      - "8222:8222" # HTTP Monitoring
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: betteragent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: betteragent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
