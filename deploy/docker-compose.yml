services:
  nats:
    image: nats:latest
    container_name: betteragent-nats
    # Requires NATS_USER / NATS_PASSWORD to be set (see ../.env.example).
    # Compose reads these from the process environment -- when launching via
    # `runner.py` they're loaded from the root .env automatically; for manual
    # `docker compose` invocations, export them first or pass --env-file ../.env.
    command: ["-js", "--user", "${NATS_USER:?Set NATS_USER in .env before starting NATS}", "--pass", "${NATS_PASSWORD:?Set NATS_PASSWORD in .env before starting NATS}"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222" # HTTP Monitoring
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: betteragent-redis
    # Requires REDIS_PASSWORD to be set (see ../.env.example). Redis holds
    # every user's short-term conversation buffer -- must never be anonymous.
    # Enables RDB snapshotting + AOF persistence mapped to volume.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env before starting Redis}", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: betteragent-qdrant
    # Requires QDRANT_API_KEY to be set (see ../.env.example).
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env before starting Qdrant}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.10
    container_name: betteragent-funasr
    working_dir: /workspace/FunASR/runtime
    command:
      - bash
      - -c
      - |
        exec /workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass \
          --download-model-dir /workspace/models \
          --model-dir damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx \
          --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx \
          --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx \
          --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx \
          --itn-dir thuduj12/fst_itn_zh \
          --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst \
          --decoder-thread-num 8 \
          --model-thread-num 1 \
          --io-thread-num 2 \
          --port 10095 \
          --certfile "" \
          --keyfile "" \
          --hotword /workspace/FunASR/runtime/websocket/hotwords.txt
    ports:
      - "127.0.0.1:10095:10095"
    volumes:
      - funasr_models:/workspace/models
    restart: unless-stopped

volumes:
  funasr_models:
  qdrant_data:
  redis_data:

